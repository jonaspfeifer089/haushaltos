name: Code Quality & Type Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node_version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Prettier Format Check
        run: npx prettier --check .

      - name: Next.js Linter
        run: npm run lint

      - name: TypeScript Type Check
        run: npx tsc --noEmit
